[workspace]
resolver = "2"
members = ["crates/model", "crates/app", "crates/i18n"]
default-members = ["crates/app"]

[workspace.package]
edition = "2024"
publish = false
version = "0.2.0"
license = "MIT OR Apache-2.0"

# Keep GUI dependencies quick to build while optimizing the data model fully.
[profile.release]
opt-level = 2
codegen-units = 16
lto = false
debug = false

[profile.release.package.acre-model]
opt-level = 3

[profile.dev]
debug = 0
