[package]
name = "acre"
description = "Acre desktop application powered by GPUI"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "acre"
path = "src/main.rs"

[dependencies]
acre-model = { path = "../model" }
acre-i18n = { path = "../i18n" }
# Enable GPUI per-frame timing for Window::draw and presentation measurements.
gpui-kit = { version = "=0.7.0", features = ["profiler"] }
image = { version = "0.25", default-features = false }
serde_json = "1"
